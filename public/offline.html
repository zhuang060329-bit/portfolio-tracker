<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<script>
  // 同 src/app/layout.tsx 的 themeInit；只設主題，其餘旗標這頁用不到
  (function () {
    try {
      var pref = localStorage.getItem('themePref') || localStorage.getItem('theme') || 'system';
      if (pref !== 'light' && pref !== 'dark') pref = 'system';
      var resolved = pref === 'system'
        ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        : pref;
      document.documentElement.dataset.theme = resolved;
    } catch (e) {}
  })();
</script>
<title>StackWorth — 離線</title>
<style>
  /* 純靜態頁：SW 斷線時才會出現，拿不到 globals.css 與自架字體，
     所以色值照抄 globals.css 兩個主題的 token，字體用系統字。
     跟站內同源，localStorage 讀得到：下方 script 照 layout.tsx 的 themeInit
     設 data-theme。三層順序：script 設的 data-theme 優先；script 沒跑（或
     localStorage 被封鎖）時退回系統設定；兩者都沒有時是深色。 */
  :root, :root[data-theme="dark"] {
    --page: #0e151b; --text: #dce6e9; --muted: #9fb0b5;
    --accent: #6aaac6; --btn-text: #0e151b; --line: rgba(220, 230, 233, 0.24);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --page: #e7eef0; --text: #101820; --muted: #46565f;
      --accent: #195f7a; --btn-text: #f4f8f9; --line: rgba(16, 24, 32, 0.32);
    }
  }
  :root[data-theme="light"] {
    --page: #e7eef0; --text: #101820; --muted: #46565f;
    --accent: #195f7a; --btn-text: #f4f8f9; --line: rgba(16, 24, 32, 0.32);
  }
  body { margin: 0; min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; padding: 24px;
         box-sizing: border-box; background: var(--page); color: var(--text);
         font-family: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; }
  main { width: 100%; max-width: 420px; margin: 0 auto; border-top: 1px solid var(--line); padding-top: 20px; }
  .label { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600;
           letter-spacing: 0.06em; color: var(--muted); }
  .label svg { color: var(--accent); }
  h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.01em; margin: 10px 0 0; }
  p { margin: 8px 0 0; font-size: 14px; color: var(--muted); line-height: 1.6; }
  button { margin-top: 20px; min-height: 44px; padding: 0 22px; font: inherit; font-size: 14px; font-weight: 600;
           color: var(--btn-text); background: var(--accent); border: 0; border-radius: 0; cursor: pointer;
           /* 同站內 .btn-primary 的斜角 */
           clip-path: polygon(7px 0, 100% 0, 100% calc(100% - 7px), calc(100% - 7px) 100%, 0 100%, 0 7px); }
  button:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--accent), inset 0 0 0 4px var(--btn-text); }
</style>
</head>
<body>
  <main>
    <div class="label">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" aria-hidden="true">
        <circle cx="8" cy="8" r="4.5"/><path d="M8 0.5v15M0.5 8h15"/>
      </svg>
      StackWorth
    </div>
    <h1>目前離線</h1>
    <p>連上網路後就能載入最新持倉與報價。<br>為了避免顯示過期的金額，離線時不提供快取資料。</p>
    <button onclick="location.reload()">重新載入</button>
  </main>
</body>
</html>
